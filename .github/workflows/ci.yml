name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "csvkit==2.2.0" pytest
          pip install -e .

      - name: Apply the patch to installed csvkit
        shell: bash
        run: |
          # The tests import csvkit from _csvkit_patched/, which does not exist in
          # a fresh clone (it is gitignored). Build it the same way a user would:
          # from the pinned upstream version, then apply the patch. This is also
          # the check that the patch still applies to that exact version - a
          # failure here means a release blocker, not a test flake.
          bash tools/setup_patched_csvkit.sh

      - name: Run csvai tests
        run: python -m pytest tests/ -q

      # The "help text does not mention AI without the extra" check lives inside
      # tests/test_integration.py, where it can build a hermetic environment.
      # Duplicating it as a shell step added a heredoc that broke under the CI
      # shell while proving nothing new.

      - name: Offline-only smoke test
        env:
          CSVAI_DISABLE: '1'
        shell: bash
        run: |
          # No key, layer disabled: the rule engine must still serve requests.
          csvai doctor
          csvai classify --offline -f examples/real/orders.csv
          csvai ask --offline -f examples/real/orders.csv --dry-run "按 城市 排序"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff
      - run: ruff check csvai tests tools
